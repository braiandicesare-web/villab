  <style>
    /* --- FAB --- */
    #vb-fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 9999;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 6px 28px rgba(243,154,30,0.45);
      transition: transform .25s, box-shadow .25s;
    }
    #vb-fab:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 36px rgba(243,154,30,0.6);
    }
    #vb-fab img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }
    #vb-fab::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(243,154,30,0.55);
      animation: vb-pulse 2s infinite;
    }
    #vb-fab.open::after { display: none; }
    @keyframes vb-pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* --- Finestra chat --- */
    #vb-window {
      position: fixed;
      bottom: 110px;
      right: 28px;
      width: 370px;
      max-width: calc(100vw - 40px);
      height: 560px;
      max-height: calc(100vh - 130px);
      background: linear-gradient(160deg, #0b2d4a 0%, #081e32 100%);
      border: 1px solid rgba(243,154,30,0.22);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      z-index: 9998;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
      overflow: hidden;
      transform: scale(0.92) translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .22s ease;
    }
    #vb-window.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }

    /* --- Header --- */
    #vb-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(14,53,88,0.85);
      border-bottom: 1px solid rgba(243,154,30,0.18);
      flex-shrink: 0;
    }
    #vb-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--villab-orange);
      flex-shrink: 0;
    }
    .vb-header-info { flex: 1; }
    .vb-header-name {
      font-size: .88rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .vb-header-status {
      font-size: .72rem;
      color: var(--villab-orange);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .vb-status-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
    }
    #vb-close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.45);
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      transition: color .2s;
      font-family: "Poppins", sans-serif;
    }
    #vb-close-btn:hover { color: #fff; }

    /* --- Messaggi --- */
    #vb-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(243,154,30,0.25) transparent;
    }
    #vb-messages::-webkit-scrollbar { width: 4px; }
    #vb-messages::-webkit-scrollbar-thumb {
      background: rgba(243,154,30,0.3);
      border-radius: 4px;
    }
    .vb-msg {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      animation: vbFadeUp .3s ease both;
    }
    @keyframes vbFadeUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .vb-msg-bot { justify-content: flex-start; }
    .vb-msg-bot .vb-bubble {
      background: rgba(30,90,137,0.35);
      border: 1px solid rgba(243,154,30,0.15);
      border-radius: 18px 18px 18px 4px;
      color: #fff;
      padding: 11px 15px;
      font-size: .87rem;
      line-height: 1.6;
      max-width: 82%;
      white-space: pre-line;
    }
    .vb-msg-bot .vb-bubble a { color: var(--villab-orange); }
    .vb-mini-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--villab-orange);
      flex-shrink: 0;
    }
    .vb-msg-user { justify-content: flex-end; }
    .vb-msg-user .vb-bubble {
      background: var(--villab-orange);
      border-radius: 18px 18px 4px 18px;
      color: var(--primary-blue);
      padding: 11px 15px;
      font-size: .87rem;
      font-weight: 600;
      line-height: 1.5;
      max-width: 78%;
    }

    /* Typing */
    .vb-typing .vb-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
    }
    .vb-typing-dot {
      width: 7px;
      height: 7px;
      background: rgba(255,255,255,0.55);
      border-radius: 50%;
      animation: vbBounce 1.1s infinite ease-in-out;
    }
    .vb-typing-dot:nth-child(2) { animation-delay:.18s; }
    .vb-typing-dot:nth-child(3) { animation-delay:.36s; }
    @keyframes vbBounce {
      0%,80%,100% { transform:translateY(0); opacity:.45; }
      40%         { transform:translateY(-6px); opacity:1; }
    }
    .vb-typing-text {
      font-size: .8rem;
      color: rgba(255,255,255,0.5);
      font-style: italic;
      margin-left: 4px;
    }

    /* --- Opzioni --- */
    #vb-options {
      padding: 10px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
      border-top: 1px solid rgba(243,154,30,0.1);
    }
    .vb-opt-btn {
      background: rgba(14,53,88,0.6);
      border: 1px solid rgba(243,154,30,0.25);
      border-radius: 50px;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: .82rem;
      font-weight: 500;
      padding: 9px 16px;
      cursor: pointer;
      text-align: left;
      transition: background .2s, border-color .2s, transform .15s;
    }
    .vb-opt-btn:hover {
      background: rgba(243,154,30,0.15);
      border-color: var(--villab-orange);
      transform: translateX(3px);
    }
    .vb-opt-btn:active { transform: scale(0.97); }

    @media (max-width: 480px) {
      #vb-window { width: calc(100vw - 22px); right: 11px; bottom: 96px; }
      #vb-fab    { bottom: 16px; right: 14px; width: 60px; height: 60px; }
    }

      },
      whatsapp: {
        bot: "Scrivici su WhatsApp, ti rispondiamo velocemente!\n📱 +39 320 696 6688\n\nSiamo disponibili tutti i giorni. 🙂",
        options: [
          { label: "📸 Instagram",          next: "instagram" },
          { label: "🔙 Torna all'inizio",   next: "home" }
        ]
      },
      instagram: {
        bot: "Seguici su Instagram per restare aggiornato/a su eventi, novità e tutto quello che succede da Villab!\n📸 @villab_villacarcina",
        options: [
          { label: "📱 WhatsApp",           next: "whatsapp" },
          { label: "🔙 Torna all'inizio",   next: "home" }
        ]
      }
    };

    var fab      = document.getElementById('vb-fab');
    var win      = document.getElementById('vb-window');
    var messages = document.getElementById('vb-messages');
    var options  = document.getElementById('vb-options');
    var closeBtn = document.getElementById('vb-close-btn');
    var isWaiting = false;
    var initialized = false;

    fab.addEventListener('click', function () {
      var isOpen = win.classList.contains('open');
      if (isOpen) {
        win.classList.remove('open');
        fab.classList.remove('open');
      } else {
        win.classList.add('open');
        fab.classList.add('open');
        if (!initialized) { initialized = true; goToNode('home'); }
      }
    });

    closeBtn.addEventListener('click', function () {
      win.classList.remove('open');
      fab.classList.remove('open');
    });

    function makeAvatar() {
      var img = document.createElement('img');
      img.className = 'vb-mini-avatar';
      img.src = 'images/IconaChatbot.png';
      img.alt = '';
      return img;
    }

    function addBotMessage(text, onDone) {
      var row = document.createElement('div');
      row.className = 'vb-msg vb-msg-bot';
      row.appendChild(makeAvatar());
      var bubble = document.createElement('div');
      bubble.className = 'vb-bubble';
      row.appendChild(bubble);
      messages.appendChild(row);
      scrollDown();

      var i = 0;
      var speed = 35;
      function typeNext() {
        if (i < text.length) {
          if (text[i] === '\n') {
            bubble.appendChild(document.createElement('br'));
          } else {
            bubble.appendChild(document.createTextNode(text[i]));
          }
          i++;
          scrollDown();
          setTimeout(typeNext, speed);
        } else {
          if (typeof onDone === 'function') onDone();
        }
      }
      typeNext();
    }

    function addUserMessage(text) {
      var row = document.createElement('div');
      row.className = 'vb-msg vb-msg-user';
      var bubble = document.createElement('div');
      bubble.className = 'vb-bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      messages.appendChild(row);
      scrollDown();
    }

    function addTyping() {
      var row = document.createElement('div');
      row.className = 'vb-msg vb-msg-bot vb-typing';
      row.id = 'vb-typing';
      row.appendChild(makeAvatar());
      var bubble = document.createElement('div');
      bubble.className = 'vb-bubble';
      bubble.innerHTML = '<span class="vb-typing-dot"></span><span class="vb-typing-dot"></span><span class="vb-typing-dot"></span><span class="vb-typing-text">Sto pensando…</span>';
      row.appendChild(bubble);
      messages.appendChild(row);
      scrollDown();
    }

    function removeTyping() {
      var el = document.getElementById('vb-typing');
      if (el) el.remove();
    }

    function renderOptions(opts) {
      options.innerHTML = '';
      opts.forEach(function (opt) {
        var btn = document.createElement('button');
        btn.className = 'vb-opt-btn';
        btn.textContent = opt.label;
        btn.addEventListener('click', function () { handleChoice(opt.label, opt.next); });
        options.appendChild(btn);
      });
    }

    function handleChoice(label, next) {
      if (isWaiting) return;
      isWaiting = true;
      addUserMessage(label);
      options.innerHTML = '';
      addTyping();
      setTimeout(function () {
        removeTyping();
        goToNode(next);
      }, 1800);
    }

    function goToNode(nodeId) {
      var node = TREE[nodeId];
      if (!node) return;
      /* mostra i pulsanti solo quando il typewriter ha finito */
      addBotMessage(node.bot, function () {
        renderOptions(node.options);
        isWaiting = false;
      });
    }

    function scrollDown() {
      messages.scrollTop = messages.scrollHeight;
    }
  })();
  </script>
